name: Predictive Maintenance Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  prepare-data:
    name: Prepare Train and Test Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas scikit-learn

      - name: Prepare data
        run: |
          mkdir -p artifacts

          python - <<'PY'
          import pandas as pd
          from sklearn.model_selection import train_test_split

          DATA_PATH = "data/engine_data.csv"
          TARGET = "Engine Condition"

          df = pd.read_csv(DATA_PATH)

          print("Dataset shape:", df.shape)
          print("Columns:", df.columns.tolist())

          X = df.drop(columns=[TARGET])
          y = df[TARGET]

          X_train, X_test, y_train, y_test = train_test_split(
              X,
              y,
              test_size=0.20,
              random_state=42,
              stratify=y
          )

          train_df = X_train.copy()
          train_df[TARGET] = y_train.values

          test_df = X_test.copy()
          test_df[TARGET] = y_test.values

          train_df.to_csv("artifacts/train.csv", index=False)
          test_df.to_csv("artifacts/test.csv", index=False)

          print("Train shape:", train_df.shape)
          print("Test shape:", test_df.shape)
          print("Train and test files created successfully.")
          PY

      - name: Upload train and test workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: train-test-data
          path: artifacts/


  model-stage:
    name: Load Train Test Artifact
    runs-on: ubuntu-latest
    needs: prepare-data

    steps:
      - name: Download train and test artifacts
        uses: actions/download-artifact@v4
        with:
          name: train-test-data
          path: artifacts/

      - name: Verify workflow artifacts
        run: |
          echo "Downloaded workflow artifacts:"
          ls -lh artifacts/

          echo ""
          echo "Train file:"
          test -f artifacts/train.csv

          echo ""
          echo "Test file:"
          test -f artifacts/test.csv

          echo ""
          echo "Workflow artifact verification successful."
